<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" fill="none">
  <title>Following a query's ideal bit pattern</title>
  <desc>A blue path follows matching bits through a branching index toward a document. Other branches remain visible in grey. This is an illustration, not a measurement.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DCE5ED"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#233E60" flood-opacity=".07"/></filter>
  </defs>
  <rect width="800" height="400" fill="#F0F5F9"/>
  <rect width="800" height="400" fill="url(#dots)"/>
  <circle cx="612" cy="200" r="148" fill="#E6EFF8"/>
  <!-- Grey paths stay visible alongside the selected path. -->
  <g stroke="#BECBD8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M233 202H289Q311 202 323 185L359 138"/>
    <path d="M307 202Q322 202 334 223L364 273"/>
    <path d="M386 134H421Q437 134 449 154L471 185"/>
    <path d="M386 278H428L473 251M428 278L473 318"/>
    <path d="M495 184H547M495 252H547M495 318H547"/>
  </g>
  <path d="M233 202H286Q306 202 321 181L354 135Q365 122 386 122H420Q437 122 451 109L470 92H616" stroke="#3478C6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The query's preferred signs are shown as a short binary key. -->
  <g filter="url(#shadow)">
    <rect x="60" y="139" width="181" height="126" rx="17" fill="white" stroke="#CAD7E3"/>
    <rect x="77" y="156" width="40" height="5" rx="2.5" fill="#CDD8E3"/>
    <rect x="77" y="178" width="147" height="64" rx="9" fill="#E8F1FC"/>
  </g>
  <text x="150" y="222" text-anchor="middle" font-family="monospace" font-size="40" letter-spacing="4" fill="#285F9F">1011</text>
  <g fill="white" stroke="#BDD0E2" stroke-width="2">
    <rect x="341" y="99" width="72" height="48" rx="10"/>
    <rect x="453" y="69" width="82" height="48" rx="10"/>
    <rect x="344" y="254" width="68" height="48" rx="10"/>
    <rect x="461" y="163" width="55" height="43" rx="9"/>
    <rect x="461" y="230" width="55" height="43" rx="9"/>
    <rect x="461" y="296" width="55" height="43" rx="9"/>
  </g>
  <g font-family="monospace" font-size="26" text-anchor="middle">
    <text x="377" y="132" fill="#285F9F">1</text>
    <text x="494" y="102" fill="#285F9F">10</text>
    <text x="378" y="285" fill="#93A4B4">0</text>
  </g>
  <g fill="#CBD6E0"><circle cx="489" cy="184" r="5"/><circle cx="489" cy="252" r="5"/><circle cx="489" cy="318" r="5"/></g>
  <!-- A small stack of indexed documents, with one matching code highlighted. -->
  <rect x="641" y="90" width="101" height="151" rx="12" fill="#DDE8F2" stroke="#C4D3E1"/>
  <rect x="629" y="102" width="101" height="151" rx="12" fill="#F7FAFD" stroke="#C4D3E1"/>
  <g filter="url(#shadow)"><rect x="610" y="70" width="109" height="168" rx="13" fill="white" stroke="#3478C6" stroke-width="2.5"/></g>
  <rect x="628" y="89" width="73" height="39" rx="6" fill="#3478C6"/>
  <text x="665" y="116" text-anchor="middle" font-family="monospace" font-size="24" fill="white">1011</text>
  <g stroke="#CBD7E2" stroke-width="5" stroke-linecap="round"><path d="M630 153H696M630 170H684M630 187H694M630 204H667"/></g>
  <g fill="#AEBECC"><circle cx="561" cy="184" r="5"/><circle cx="561" cy="252" r="5"/><circle cx="561" cy="318" r="5"/></g>
  <circle cx="289" cy="202" r="8" fill="#3478C6" stroke="#F0F5F9" stroke-width="4"/>
</svg>
